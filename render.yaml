# Render Blueprint: creates the web service from this repo with one click.
# Secrets are entered in the Render dashboard, never in this file.
services:
  - type: web
    name: dominos-pr
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
